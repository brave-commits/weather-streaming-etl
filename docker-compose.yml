version: '3.5'

networks: 
  weather_kafka:
    name: weather_kafka

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:latest
    container_name: zookeeper
    networks: 
      - weather_kafka
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181

  broker:
    image: confluentinc/cp-kafka:latest
    container_name: broker
    ports: 
      - "19092:19092"
      - "9092:9092"
    networks: 
      - weather_kafka
    depends_on:
      - zookeeper
    env_file:
      - .env-kafka

  weather-client:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: weather-client
    depends_on: 
      - broker
    networks: 
      - weather_kafka
    entrypoint: 
      - bash 
      - -c 
      - |
        echo 'Giving Kafka a bit of time to start up…'
        sleep 30
        python run.py broker:9092

  sqlserver:
   image: mcr.microsoft.com/azure-sql-edge:latest
   container_name: sqlserver
   ports:
     - 1433:1433
   volumes:
     - ./logs/sql/data:/var/opt/mssql/data
     - ./logs/sql/log:/var/opt/mssql/log
     - ./logs/sql/secrets:/var/opt/mssql/secrets
   env_file:
     - .env-dbconn
   depends_on:
     - broker
        